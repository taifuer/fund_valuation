services:
  frontend:
    build:
      context: .
      target: frontend
    ports:
      - "${FUND_VALUATION_HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: .
      target: backend
    environment:
      FUND_VALUATION_DATA_DIR: /app/data
      FUND_VALUATION_DIAGNOSTICS_TOKEN: ${FUND_VALUATION_DIAGNOSTICS_TOKEN:-}
      FUND_VALUATION_PREWARM: "0"
    volumes:
      - fund-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      target: backend
    command: ["python", "-m", "backend.worker"]
    environment:
      FUND_VALUATION_DATA_DIR: /app/data
    volumes:
      - fund-data:/app/data
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  fund-data:
