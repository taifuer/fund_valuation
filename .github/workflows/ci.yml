name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: Run backend tests
        run: .venv/bin/python -m unittest discover -s backend/tests

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run test:frontend
      - run: npm run build

  e2e:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: npm ci
      - name: Install backend dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify Compose deployment
        env:
          FUND_VALUATION_HTTP_PORT: '18080'
          FUND_VALUATION_DIAGNOSTICS_TOKEN: ci-smoke-token
        run: |
          set -euo pipefail
          cleanup() {
            docker compose logs --no-color > docker-compose.log 2>&1 || true
            docker compose --profile tools down -v --remove-orphans || true
          }
          trap cleanup EXIT
          docker compose config --quiet
          docker compose build backend frontend worker db-tools
          docker compose up -d backend frontend
          curl --fail --retry 20 --retry-delay 2 --retry-all-errors http://127.0.0.1:18080/api/health
          curl --fail http://127.0.0.1:18080/api/ready | grep -q '"ready":true'
          curl --fail http://127.0.0.1:18080/api/meta | grep -q '"dashboardSchemaVersion":1'
          curl --fail http://127.0.0.1:18080/risk | grep -q '<div id="root"></div>'
          docker compose --profile tools run --rm db-tools | grep -q '"integrity": "ok"'
          docker compose --profile tools run --rm db-tools python -m backend.db_admin backup | grep -q 'Backup created:'
      - name: Upload Compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-logs
          path: docker-compose.log
          retention-days: 7
